name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install system deps (nlopt for armplanning)
        run: bash ./setup.sh

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup (system deps + venv)
        run: make setup

      - name: Build
        run: make build

      - name: Test
        run: make test
